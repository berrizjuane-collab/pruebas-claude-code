<title>Veterinaria Berrizbeitia</title>

<script>
/* ╔══════════════════════════════════════════════════════════════════════╗
   ║  CONFIGURACIÓN — TODO LO EDITABLE DE LA PÁGINA ESTÁ AQUÍ             ║
   ║  Cambia los valores entre comillas y guarda. No hace falta tocar     ║
   ║  nada más: el HTML de abajo se rellena solo a partir de este objeto. ║
   ╚══════════════════════════════════════════════════════════════════════╝ */
const CONFIG = {

  /* ── 1. IDENTIDAD ─────────────────────────────────────────────────── */
  nombre: "Veterinaria Berrizbeitia",         // Nombre completo (título de la página, copyright y hero).
  marca:  "Berrizbeitia",                      // Palabra del nombre que se muestra en grande en el hero y en el logo. El resto ("Veterinaria") va en la línea pequeña de arriba.
  frase:  "Cuidamos a quienes te cuidan sin pedir nada a cambio.",
  descripcion: "Consulta veterinaria, vacunación, desparasitación y emergencias. Precios claros, horario y ubicación.",
  // ↑ La descripción también está escrita a mano en las metaetiquetas del <head>
  //   (description y Open Graph). Si la cambias aquí, cámbiala allí también:
  //   las vistas previas de WhatsApp o Google no ejecutan JavaScript.

  /* ── 2. CONTACTO ──────────────────────────────────────────────────── */
  telefono:  "+58 424-181-2977",             // Se muestra tal cual; el enlace para llamar (tel:+584241812977) se arma solo.
  whatsapp:  "+58 424-181-2977",             // Con código de país. Espacios y guiones no importan (https://wa.me/584241812977).
  mensajeWhatsapp: "Hola, quisiera agendar una cita para mi mascota.",  // Texto que aparece ya escrito al abrir el chat.
  // Opcionales: si agregas  correo: "nombre@dominio.com"  o  instagram: "@usuario"
  // aparecen solos como botones en la sección Contacto. Si no existen, no se muestran.

  /* ── 3. SERVICIOS ─────────────────────────────────────────────────── */
  // icono: "consulta" | "vacuna" | "desparasitacion" | "emergencia"
  // La tarjeta con icono "emergencia" se pinta en azul marino para destacarla.
  servicios: [
    { icono: "consulta",        titulo: "Consulta general", texto: "Revisión completa, diagnóstico y un plan claro de cuidado." },
    { icono: "vacuna",          titulo: "Vacunación",       texto: "Esquema al día para cachorros, gatitos y adultos." },
    { icono: "desparasitacion", titulo: "Desparasitación",  texto: "Protección interna y externa, según peso y edad." },
    { icono: "emergencia",      titulo: "Emergencias",      texto: "Atención prioritaria. Llama antes de venir y te esperamos." }
  ],

  /* ── 4. PRECIOS ───────────────────────────────────────────────────── */
  precios: {
    destacado: {                              // El precio que se muestra en grande.  
      nombre:  "Consulta general",
      precio:  "$25",
      detalle: "Revisión física completa y orientación para el cuidado en casa."
    },
    otros: [                                  // De 2 a 4 filas. desde: true antepone la palabra "desde".
      { nombre: "Vacuna antirrábica", precio: "$15", desde: false },
      { nombre: "Desparasitación",    precio: "$10", desde: true  },
      { nombre: "Baño medicado",      precio: "$20", desde: true  }
    ],
    nota: "Precios de referencia. Pueden variar según el caso; siempre te confirmamos el monto antes de cualquier procedimiento."
  },

  /* ── 5. HORARIO ───────────────────────────────────────────────────── */
  // Siempre 7 filas, en este orden: de lunes a domingo.
  // Horas en formato de 24 h ("08:00", "18:00"). Día cerrado: abre: null, cierra: null.
  horario: [
    { dia: "Lunes",     abre: "09:00", cierra: "13:00" },
    { dia: "Martes",    abre: "09:00", cierra: "13:00" },
    { dia: "Miércoles", abre: "09:00", cierra: "13:00" },
    { dia: "Jueves",    abre: "09:00", cierra: "13:00" },
    { dia: "Viernes",   abre: "09:00", cierra: "13:00" },
    { dia: "Sábado",    abre: null,    cierra: null    },
    { dia: "Domingo",   abre: null,    cierra: null    }
  ],
  // El indicador "Abierto ahora / Cerrado" usa la hora local del dispositivo del visitante.
  // Para fijarlo a la hora de la clínica (útil si alguien la abre desde otro país),
  // escribe aquí su zona horaria, por ejemplo "America/Caracas".
  zonaHoraria: "",
  emergencias: {
    texto:    "Emergencias fuera de horario: llámanos al",
    telefono: "+58 424-181-2977"              // Número para emergencias (aquí es el mismo que el principal).
  },

  /* ── 6. UBICACIÓN ─────────────────────────────────────────────────── */
  // Dirección escrita (opcional). Si linea1 queda vacía, se muestra el texto
  // textos.ubicacion.sinDireccion y el visitante llega por el enlace de Google Maps.
  direccion: {
    linea1: "",                               // Ej.: "Av. Principal, Local 3"
    ciudad: "",                               // Ej.: "Caracas"
    referencia: ""                            // Opcional: "Frente a la plaza…". Vacío = no se muestra.
  },
  mapa: {
    // Enlace de Google Maps de la clínica. Lo abren, en una pestaña nueva, el botón
    // "Cómo llegar" y toda la tarjeta del mapa.
    enlace: "https://maps.app.goo.gl/fKsbucGSvR576T1f8",
    // "tarjeta" → plano ilustrado que abre el enlace de arriba (los enlaces cortos de Maps no se pueden incrustar).
    // "iframe"  → mapa interactivo embebido; usa "busqueda" (ver abajo) en lugar del enlace corto.
    modo: "tarjeta",
    // Solo para modo "iframe": lo que escribirías en el buscador de Google Maps. Si lo usas,
    // "Cómo llegar" sigue abriendo "enlace".
    busqueda: ""
  },

  /* ── 7. IMÁGENES REALES (opcional) ────────────────────────────────── */
  // Deja "" para seguir viendo la ilustración de relleno.
  imagenes: {
    hero:      "",   // Foto principal. Proporción 4:5 (vertical), recomendado 960 × 1200 px. Ej.: "fotos/hero.jpg"
    heroAlt:   "Un perro y un gato sentados juntos",
    ubicacion: "",   // Foto de la fachada (solo se usa con mapa.modo "tarjeta"). Proporción 16:10, 1280 × 800 px.
    ubicacionAlt: "Fachada de la clínica"
  },

  /* ── 8. TEXTOS DE LA PÁGINA ───────────────────────────────────────── */
  textos: {
    botonCita:     "Agendar cita",
    botonWhatsapp: "Escribir por WhatsApp",
    botonLlamar:   "Llamar",
    botonMapa:     "Cómo llegar",
    servicios: { titulo: "Servicios", intro: "Lo esencial para que tu mascota esté sana." },
    precios:   { titulo: "Precios",   intro: "Para que sepas cuánto cuesta antes de venir." },
    horario:   { titulo: "Horario" },
    ubicacion: { titulo: "Ubicación", intro: "Te esperamos aquí.", sinDireccion: "Encuéntranos en Google Maps", abrirMapa: "Abrir en Google Maps" },
    contacto:  { titulo: "Contacto",  intro: "Escríbenos o llámanos. Respondemos en horario de atención." },
    derechos:  "Todos los derechos reservados."
  }
};
/* ═════════════════ FIN DE LA CONFIGURACIÓN ═════════════════ */
</script>

<style>
/* Composición: columna de 1168 px con 20 px de margen. Cada sección abre con una regla fina,
   su número en itálica y el título. Los fondos marcan el ritmo:
   blanco (cabecera) → hielo (hero) → blanco (servicios) → paneles hielo y marino (precios y
   horario) → niebla (ubicación) → cielo (contacto) → marino (pie). Sin sombras: solo líneas de 1 px. */
:root {
  /* Color */
  --marino: #0B2545;        /* tinta principal, panel de horario, pie */
  --azul: #1F4E79;          /* números de sección, etiquetas, detalles */
  --acero: #3A6797;         /* trazos intermedios */
  --celeste: #8DB3E2;       /* acento: botón WhatsApp, fila de hoy */
  --cielo: #CFE0F3;         /* banda de contacto, fondo de la ilustración */
  --hielo: #E6EEF7;         /* hero, panel de precios */
  --niebla: #F3F7FC;        /* banda de ubicación, celdas */
  --blanco: #FFFFFF;
  --tinta-suave: #4A5D78;   /* texto secundario */
  --regla-suave: rgba(11, 37, 69, .16);      /* líneas finas */
  --regla-clara: rgba(255, 255, 255, .22);   /* líneas sobre marino */
  --sobre-marino: rgba(255, 255, 255, .74);  /* texto secundario sobre marino */

  /* Tipografía */
  --f-serif: "Instrument Serif", "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  --f-texto: "Manrope", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;

  /* Esquinas */
  --recto: 2px;    /* estructura: rejilla de servicios, tablas, chips */
  --boton: 12px;   /* botones, indicador de estado, caja de emergencias */
  --suave: 16px;   /* objetos: tarjetas, paneles, ilustración, mapa, filas de contacto */

  --alto-cabecera: 64px;
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-padding-top: calc(var(--alto-cabecera) + 16px + env(safe-area-inset-top, 0px)); }
body {
  margin: 0;
  background: var(--blanco);
  color: var(--marino);
  font-family: var(--f-texto);
  font-size: 1rem;
  line-height: 1.65;
  -webkit-font-smoothing: antialiased;
}
/* Pinta la franja de la barra de estado en teléfonos con muesca. */
body::before {
  content: ""; position: fixed; inset: 0 0 auto; z-index: 30;
  height: env(safe-area-inset-top, 0px); background: var(--blanco);
}
img, svg { display: block; max-width: 100%; }
a { color: inherit; }
h1, h2, h3, p, ul, table, figure { margin: 0; }
ul { padding: 0; list-style: none; }
:focus-visible { outline: 2px solid var(--azul); outline-offset: 3px; border-radius: var(--recto); }
.panel--horario :focus-visible, .pie :focus-visible { outline-color: var(--celeste); }

.solo-lectores {
  position: absolute; width: 1px; height: 1px; overflow: hidden;
  clip-path: inset(50%); white-space: nowrap;
}
.saltar {
  position: absolute; left: 16px; top: -80px; z-index: 50;
  background: var(--marino); color: var(--blanco); padding: 10px 16px; border-radius: var(--boton);
}
.saltar:focus { top: calc(env(safe-area-inset-top, 0px) + 12px); }

.envoltura {
  width: 100%; max-width: 1208px; margin-inline: auto;   /* 1168 px de contenido + 20 px por lado */
  padding-left: max(20px, env(safe-area-inset-left, 0px));
  padding-right: max(20px, env(safe-area-inset-right, 0px));
}
.seccion { padding-block: clamp(52px, 7.5vw, 92px); }
.banda--niebla { background: var(--niebla); }
.banda--cielo { background: var(--cielo); }

/* ── Tipografía ── */
.titulo {
  font-family: var(--f-serif); font-weight: 400;
  font-size: clamp(2.5rem, 6.4vw, 3.75rem); line-height: 1; letter-spacing: -.01em;
  text-wrap: balance;
}
.etiqueta {
  font: 600 .72rem/1.4 var(--f-texto); text-transform: uppercase; letter-spacing: .14em; color: var(--azul);
}
.intro { color: var(--tinta-suave); max-width: 48ch; margin-top: 12px; }
.icono { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* Encabezado de sección: regla, número en itálica y título */
.cab { border-top: 1px solid var(--marino); padding-top: 18px; display: grid; gap: 6px; grid-template-columns: minmax(0, 1fr); }
.cab-num { font: italic 400 2.2rem/1 var(--f-serif); color: var(--azul); font-variant-numeric: lining-nums; }
@media (min-width: 940px) { .cab { grid-template-columns: 128px minmax(0, 1fr); gap: 0; padding-top: 22px; } .cab-num { padding-top: 6px; } }
.cab--panel { border-top: 0; padding-top: 0; display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 16px; }
.cab--panel .cab-num { padding-top: 0; }

/* ── Botones ── */
.boton {
  display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  min-height: 52px; padding: 0 24px;
  border: 1px solid var(--marino); border-radius: var(--boton);
  font: 700 .9375rem/1 var(--f-texto); text-decoration: none; white-space: nowrap; cursor: pointer;
  transition: background-color .15s ease, color .15s ease, border-color .15s ease;
}
.boton--celeste { background: var(--celeste); color: var(--marino); }
.boton--celeste:hover { background: var(--marino); color: var(--blanco); }
.boton--linea { background: transparent; color: var(--marino); }
.boton--linea:hover { background: var(--marino); color: var(--blanco); }
.boton--marino { background: var(--marino); color: var(--blanco); }
.boton--marino:hover { background: var(--azul); border-color: var(--azul); }
.boton--chico { min-height: 42px; padding: 0 18px; font-size: .875rem; }

/* ── Cabecera ── */
.cabecera {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: var(--blanco); border-bottom: 1px solid var(--marino);
}
.cabecera .envoltura { display: flex; align-items: center; justify-content: space-between; gap: 20px; height: var(--alto-cabecera); }
.logo { display: inline-flex; align-items: center; gap: 10px; text-decoration: none; font: 400 1.6rem/1 var(--f-serif); color: var(--marino); }
.logo .icono { width: 24px; height: 24px; color: var(--azul); stroke-width: 1.5; }
.nav { display: none; }
.nav ul { display: flex; gap: 26px; }
.nav a { display: inline-flex; align-items: baseline; gap: 7px; padding: 8px 0; font-size: .9375rem; font-weight: 500; text-decoration: none; background: linear-gradient(var(--marino), var(--marino)) no-repeat 0 calc(100% - 4px) / 0 1px; }
.nav a:hover { background-size: 100% 1px; }
.nav i { font: italic 400 1.05rem/1 var(--f-serif); color: var(--azul); font-variant-numeric: lining-nums; }
@media (min-width: 940px) { .nav { display: block; } }

/* ── Hero ── */
.hero { background: var(--hielo); padding-block: clamp(32px, 5vw, 64px) clamp(36px, 5vw, 60px); border-bottom: 1px solid var(--regla-suave); }
.hero-rejilla { display: grid; gap: 36px; grid-template-columns: minmax(0, 1fr); grid-template-areas: "texto" "arte" "datos"; }
.hero-texto { grid-area: texto; display: flex; flex-direction: column; align-items: flex-start; gap: 24px; min-width: 0; }
.lamina { grid-area: arte; min-width: 0; }
.datos { grid-area: datos; }

.estado {
  display: inline-flex; align-items: center; gap: 10px; padding: 7px 14px 7px 12px;
  background: var(--blanco); color: var(--marino); border: 1px solid var(--marino); border-radius: var(--boton);
  font-size: .875rem; font-weight: 600; line-height: 1.35;
}
.estado .punto { position: relative; width: 9px; height: 9px; border-radius: 50%; background: var(--azul); flex: none; }
.estado .punto::after { content: ""; position: absolute; inset: 0; border-radius: 50%; background: var(--celeste); animation: latido 2.2s ease-out infinite; }
.estado .detalle { font-weight: 500; color: var(--tinta-suave); }
.estado.cerrado .punto { background: transparent; border: 1.5px solid var(--marino); }
.estado.cerrado .punto::after { animation: none; background: transparent; }
@keyframes latido { from { transform: scale(1); opacity: .9; } to { transform: scale(3.2); opacity: 0; } }

.nombre { display: flex; flex-direction: column; gap: 6px; font-family: var(--f-serif); font-weight: 400; }
.nombre-linea { font-style: italic; font-size: clamp(1.45rem, 3.4vw, 2rem); line-height: 1.1; color: var(--azul); }
.nombre-marca { font-size: clamp(4.4rem, 19.5vw, 10rem); line-height: .86; letter-spacing: -.025em; overflow-wrap: anywhere; padding-bottom: .06em; }
.nombre-marca--largo { font-size: clamp(2.8rem, 9vw, 5rem); line-height: .95; }
.frase { border-left: 1px solid var(--marino); padding-left: 16px; font-size: clamp(1.05rem, 2vw, 1.2rem); line-height: 1.5; color: var(--tinta-suave); max-width: 32ch; text-wrap: balance; }
.hero-botones { display: flex; flex-wrap: wrap; gap: 12px; width: 100%; }
.hero-botones .boton { flex: 1 1 200px; }

/* Lámina: marco 4:5 donde va la foto principal */
.marco { aspect-ratio: 4 / 5; width: 100%; max-width: 100%; overflow: hidden; background: var(--cielo); border: 1px solid var(--marino); border-radius: var(--suave); }
.marco > svg, .marco > img { width: 100%; height: 100%; object-fit: cover; }
.lamina figcaption { display: flex; align-items: baseline; gap: 12px; margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--regla-suave); }
.lamina figcaption i { font: italic 400 1.05rem/1.3 var(--f-serif); color: var(--tinta-suave); }
/* Trazos de la ilustración: 2 px para contornos, 1 px para detalles, guías en azul al 45 % */
.l-forma { fill: var(--cielo); stroke: var(--marino); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; vector-effect: non-scaling-stroke; }
.l-detalle { fill: none; stroke: var(--marino); stroke-width: 1; stroke-linecap: round; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
.l-lleno { fill: var(--marino); }
.l-guia { fill: none; stroke: var(--azul); stroke-width: 1; opacity: .45; vector-effect: non-scaling-stroke; }
.l-guia--trazos { stroke-dasharray: 4 5; }
.l-letra { font: italic 400 15px var(--f-serif); fill: var(--azul); opacity: .8; }

/* Datos rápidos */
.datos { display: grid; gap: 12px; grid-template-columns: minmax(0, 1fr); }
.dato {
  display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: start; gap: 2px 14px; padding: 16px 18px 14px; min-width: 0;
  background: var(--blanco); border: 1px solid var(--regla-suave); border-radius: var(--suave); text-decoration: none;
  transition: background-color .15s ease, border-color .15s ease;
}
.dato:hover { background: var(--niebla); border-color: var(--marino); }
.dato-valor { grid-column: 1; font: 400 1.5rem/1.2 var(--f-serif); font-variant-numeric: lining-nums; min-width: 0; }
.dato .icono { grid-column: 2; grid-row: 1 / span 2; color: var(--azul); margin-top: 2px; }

@media (min-width: 640px) {
  .hero-botones .boton { flex: 0 1 auto; }
  .datos { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .lamina { max-width: 380px; }
}
@media (min-width: 940px) {
  .hero-rejilla { grid-template-columns: minmax(0, 7fr) minmax(0, 5fr); grid-template-areas: "texto arte" "datos datos"; align-items: center; gap: 44px 56px; }
  .hero-texto { gap: 28px; }
  .lamina { max-width: 400px; justify-self: end; width: 100%; }
}

/* ── 01 Servicios: rejilla unida por líneas de 1 px ── */
.servicios {
  display: grid; gap: 1px; grid-template-columns: minmax(0, 1fr); margin-top: clamp(28px, 4vw, 44px);
  background: var(--marino); border: 1px solid var(--marino); border-radius: var(--recto); overflow: hidden;
}
.servicio { display: flex; flex-direction: column; gap: 10px; padding: 24px 22px 28px; background: var(--blanco); min-width: 0; }
.servicio:nth-child(2) { background: var(--niebla); }
.servicio:nth-child(3) { background: var(--hielo); }
.servicio:nth-child(n+4) { background: var(--cielo); }
.servicio-cima { display: flex; align-items: center; justify-content: space-between; gap: 12px; color: var(--azul); }
.servicio h3 { font: 400 1.75rem/1.1 var(--f-serif); margin-top: clamp(14px, 3vw, 40px); }
.servicio p { font-size: .9375rem; line-height: 1.6; color: var(--tinta-suave); }
.servicio.servicio--emergencia { background: var(--marino); color: var(--blanco); }
.servicio--emergencia .servicio-cima, .servicio--emergencia .etiqueta { color: var(--celeste); }
.servicio--emergencia p { color: var(--sobre-marino); }
@media (min-width: 640px) { .servicios { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (min-width: 1040px) { .servicios { grid-template-columns: repeat(4, minmax(0, 1fr)); } .servicio { padding: 26px 26px 34px; } }

/* ── 02 Precios + 03 Horario ── */
.duo { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 940px) { .duo { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; } }
.panel { border-radius: var(--suave); padding: clamp(22px, 4vw, 40px); min-width: 0; display: flex; flex-direction: column; }
.panel--precios { background: var(--hielo); border: 1px solid var(--regla-suave); }
.panel--horario { background: var(--marino); color: var(--blanco); border: 1px solid var(--marino); }
.panel--horario .cab-num { color: var(--celeste); }

.destacado { margin-top: clamp(22px, 3vw, 34px); display: flex; flex-direction: column; }
.destacado-cifra { font: 400 clamp(4.8rem, 15vw, 7rem)/.9 var(--f-serif); letter-spacing: -.02em; font-variant-numeric: lining-nums; margin-top: 6px; }
.destacado p { font-size: .9375rem; color: var(--tinta-suave); max-width: 36ch; margin-top: 12px; }
.lista-precios { margin-top: 26px; border-top: 1px solid var(--marino); }
.lista-precios li { display: flex; align-items: baseline; gap: 10px; padding: 12px 0 10px; border-bottom: 1px solid var(--regla-suave); }
.lista-precios .concepto { font-weight: 500; }
.lista-precios .puntos { flex: 1; min-width: 16px; border-bottom: 1px dotted var(--azul); transform: translateY(-5px); }
.lista-precios .monto { white-space: nowrap; }
.lista-precios .monto small { font-size: .8125rem; color: var(--tinta-suave); margin-right: 6px; }
.lista-precios .monto b { font: 400 1.65rem/1 var(--f-serif); font-variant-numeric: lining-nums; }
.nota { margin-top: auto; padding-top: 20px; font-size: .8125rem; line-height: 1.6; color: var(--tinta-suave); }

.horario-cabeza { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 16px; }
.horario-detalle { margin-top: 10px; min-height: 1.65em; font-size: .9375rem; color: var(--sobre-marino); }
.tabla-horario { width: 100%; margin-top: 16px; border-collapse: collapse; font-variant-numeric: tabular-nums lining-nums; border-top: 1px solid var(--regla-clara); }
.tabla-horario th, .tabla-horario td { padding: 10px 10px; font-size: clamp(.9rem, 3.8vw, 1rem); line-height: 1.4; border-bottom: 1px solid var(--regla-clara); }
.tabla-horario th { text-align: left; font-weight: 500; white-space: nowrap; }
.tabla-horario td { text-align: right; white-space: nowrap; color: var(--sobre-marino); }
.tabla-horario .dia-cerrado td { font: italic 400 1.2rem/1.2 var(--f-serif); }
.tabla-horario .hoy th, .tabla-horario .hoy td { background: var(--celeste); color: var(--marino); font-weight: 700; }
.tabla-horario .hoy th { border-radius: var(--recto) 0 0 var(--recto); }
.tabla-horario .hoy td { border-radius: 0 var(--recto) var(--recto) 0; }
.chip-hoy { display: inline-block; margin-left: 8px; padding: 2px 6px 1px; border-radius: var(--recto); background: var(--marino); color: var(--blanco); font: 700 .62rem/1.5 var(--f-texto); text-transform: uppercase; letter-spacing: .14em; vertical-align: 2px; }
.guardia { margin-top: auto; padding-top: 22px; }
.guardia-caja { display: flex; gap: 14px; align-items: flex-start; padding: 14px 16px; border: 1px solid var(--regla-clara); border-radius: var(--boton); font-size: .9375rem; line-height: 1.55; color: var(--sobre-marino); }
.guardia .icono { color: var(--celeste); margin-top: 3px; }
.guardia a { display: inline-block; color: var(--blanco); font-weight: 700; white-space: nowrap; text-decoration: underline; text-decoration-color: var(--celeste); text-decoration-thickness: 1px; text-underline-offset: 4px; padding-block: 3px; }
.guardia a:hover { color: var(--celeste); }

/* ── 04 Ubicación ── */
.ubicacion { display: grid; gap: 28px; grid-template-columns: minmax(0, 1fr); align-items: start; margin-top: clamp(26px, 4vw, 44px); }
.direccion { font-style: normal; display: flex; flex-direction: column; gap: 6px; }
.direccion strong { font: 400 clamp(1.7rem, 4vw, 2.1rem)/1.15 var(--f-serif); text-wrap: balance; }
.direccion .referencia { font-size: .9375rem; color: var(--tinta-suave); }
.ubicacion .boton { margin-top: 24px; }
.mapa { display: block; position: relative; text-decoration: none; aspect-ratio: 4 / 3; width: 100%; max-width: 100%; overflow: hidden; background: var(--hielo); border: 1px solid var(--marino); border-radius: var(--suave); }
.mapa-cta { position: absolute; z-index: 1; left: 14px; bottom: 14px; display: inline-flex; align-items: center; gap: 8px; padding: 8px 12px; background: var(--blanco); color: var(--marino); border: 1px solid var(--marino); border-radius: var(--boton); font: 600 .72rem/1.3 var(--f-texto); text-transform: uppercase; letter-spacing: .14em; transition: background-color .15s ease, color .15s ease; }
.mapa-cta .icono { width: 16px; height: 16px; color: var(--azul); }
a.mapa:hover .mapa-cta { background: var(--marino); color: var(--blanco); }
a.mapa:hover .mapa-cta .icono { color: var(--celeste); }
.mapa > iframe, .mapa > svg, .mapa > img { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; object-fit: cover; }
.m-fondo { fill: var(--hielo); } .m-manzana { fill: var(--niebla); stroke: var(--regla-suave); stroke-width: 1; vector-effect: non-scaling-stroke; }
.m-parque { fill: var(--cielo); stroke: var(--acero); stroke-width: 1; vector-effect: non-scaling-stroke; }
.m-calle { fill: none; stroke: var(--acero); stroke-width: 1; stroke-linecap: round; vector-effect: non-scaling-stroke; }
.m-pin { fill: var(--celeste); stroke: var(--marino); stroke-width: 2; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
.m-pin-centro { fill: var(--blanco); stroke: var(--marino); stroke-width: 1; vector-effect: non-scaling-stroke; }
@media (min-width: 940px) {
  .ubicacion { grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 56px; align-items: center; }
  .mapa { aspect-ratio: 16 / 10; }
}

/* ── 05 Contacto ── */
.contactos { display: grid; gap: 10px; margin-top: clamp(26px, 4vw, 44px); }
.contacto {
  display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 2px 16px; min-height: 76px; padding: 14px 20px;
  background: var(--blanco); border: 1px solid transparent; border-radius: var(--suave); text-decoration: none;
  transition: border-color .15s ease;
}
.contacto:hover { border-color: var(--marino); }
.contacto .etiqueta { grid-column: 1; }
.contacto-valor { grid-column: 1; font: 400 clamp(1.45rem, 4.6vw, 2.2rem)/1.15 var(--f-serif); font-variant-numeric: lining-nums; overflow-wrap: anywhere; min-width: 0; }
.contacto .icono { grid-column: 2; grid-row: 1 / span 2; color: var(--azul); width: 24px; height: 24px; }
@media (min-width: 720px) {
  .contacto { grid-template-columns: 128px minmax(0, 1fr) auto; padding: 16px 28px; }
  .contacto .etiqueta { grid-column: 1; grid-row: 1; }
  .contacto-valor { grid-column: 2; grid-row: 1; }
  .contacto .icono { grid-column: 3; grid-row: 1; }
}

/* ── Pie ── */
.pie { background: var(--marino); color: var(--sobre-marino); }
.pie .envoltura { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 24px; padding-block: 26px; font-size: .875rem; }
.pie .logo { color: var(--blanco); }
.pie .logo .icono { color: var(--celeste); }

/* ── Barra fija en móvil ── */
.barra-movil {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 25;
  display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
  padding: 10px max(14px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(14px, env(safe-area-inset-left, 0px));
  background: var(--blanco); border-top: 1px solid var(--marino);
}
.barra-movil .boton { min-height: 50px; height: 50px; padding: 0 12px; }
@media (max-width: 719.98px) { .pie .envoltura { padding-bottom: calc(26px + 72px + env(safe-area-inset-bottom, 0px)); } }
@media (min-width: 720px) { .barra-movil { display: none; } }

/* ── Movimiento: solo la entrada del hero (y el latido del indicador) ── */
@media (prefers-reduced-motion: no-preference) {
  .entra { animation: entrar .7s cubic-bezier(.2, .7, .2, 1) both; animation-delay: calc(var(--i, 0) * 90ms); }
  @keyframes entrar { from { opacity: 0; transform: translateY(14px); } }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>

        <div>
          <address class="direccion" id="direccion"></address>
          <a class="boton boton--marino" data-enlace="comoLlegar"><svg class="icono" aria-hidden="true"><use href="#i-pin"/></svg><span data-t="textos.botonMapa"></span><svg class="icono" aria-hidden="true"><use href="#i-flecha"/></svg></a>
        </div>
        <!-- ┌────────────────────────────────────────────────────────────────────────┐
             │ MAPA · con CONFIG.mapa.modo = "iframe" aquí se inserta Google Maps;    │
             │ con "tarjeta" este plano es un enlace a CONFIG.mapa.enlace.            │
             │ IMAGEN 2 · FACHADA (solo en modo "tarjeta") · proporción 16:10,        │
             │ 1280 × 800 px. Escribe su ruta en CONFIG.imagenes.ubicacion para       │
             │ reemplazar este plano de relleno.                                      │
             └────────────────────────────────────────────────────────────────────────┘ -->
        <a class="mapa" id="mapa" data-enlace="comoLlegar" aria-label="Abrir la ubicación en Google Maps (se abre en una pestaña nueva)">
          <span class="mapa-cta"><span data-t="textos.ubicacion.abrirMapa"></span><svg class="icono" aria-hidden="true"><use href="#i-flecha"/></svg></span>
          <svg viewBox="0 0 640 400" role="img" aria-label="Plano ilustrado con un marcador en la ubicación de la clínica" preserveAspectRatio="xMidYMid slice">
            <rect class="m-fondo" width="640" height="400"/>
            <path class="m-parque" d="M430 40c50-18 128-8 150 36s-14 92-70 98-104-18-116-58 6-66 36-76z"/>
            <g class="m-manzana">
              <rect x="36" y="30" width="112" height="72" rx="2"/><rect x="192" y="30" width="150" height="72" rx="2"/>
              <rect x="36" y="142" width="112" height="96" rx="2"/><rect x="192" y="142" width="96" height="84" rx="2"/>
              <rect x="428" y="222" width="176" height="56" rx="2"/><rect x="36" y="296" width="230" height="70" rx="2"/><rect x="330" y="310" width="130" height="56" rx="2"/>
            </g>
            <g class="m-calle">
              <path d="M-10 114h660M-10 130h660"/><path d="M162-10v420M178-10v420"/>
              <path d="M-10 258c160-6 250 0 330-28s150-110 330-130M-10 280c160-6 256 0 338-30s150-108 322-128"/>
              <path d="M374-10c-6 90 10 170-40 246M500 200h150M300 290v120"/>
            </g>
            <path class="l-guia" d="M330 60v300M180 232h300"/>
            <circle class="l-guia l-guia--trazos" cx="330" cy="232" r="46"/>
            <path class="m-pin" d="M330 232c-22-28-40-48-40-72a40 40 0 0 1 80 0c0 24-18 44-40 72z"/>
            <circle class="m-pin-centro" cx="330" cy="160" r="14"/>
          </svg>
        </a>
      </div>

  <!-- ═════════ 05 CONTACTO ═════════ -->
  <section class="seccion banda--cielo" id="contacto" aria-labelledby="t-contacto">
    <div class="envoltura">
      <header class="cab">
        <span class="cab-num" aria-hidden="true">05</span>
        <div><h2 class="titulo" id="t-contacto" data-t="textos.contacto.titulo"></h2><p class="intro" data-t="textos.contacto.intro"></p></div>

<!-- Barra fija (solo móvil): WhatsApp y Llamar siempre a un toque. -->
<div class="barra-movil" role="group" aria-label="Contacto rápido">
  <a class="boton boton--celeste" data-enlace="whatsapp"><svg class="icono" aria-hidden="true"><use href="#i-whatsapp"/></svg>WhatsApp</a>
  <a class="boton boton--marino" data-enlace="telefono"><svg class="icono" aria-hidden="true"><use href="#i-telefono"/></svg><span data-t="textos.botonLlamar"></span></a>
</div>

<noscript><p style="padding:24px;text-align:center">Esta página necesita JavaScript para mostrar la información de la clínica.</p></noscript>

<script>
/* ═════════ LÓGICA DE LA PÁGINA (no hace falta editarla) ═════════ */
(function () {
  "use strict";
  var C = CONFIG;
  var $ = function (s) { return document.querySelector(s); };
  var $$ = function (s) { return Array.prototype.slice.call(document.querySelectorAll(s)); };
  var esc = function (s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (ch) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch];
    });
  };
  var digitos = function (s) { return String(s).replace(/\D/g, ""); };
  var icono = function (id) { return '<svg class="icono" aria-hidden="true"><use href="#i-' + id + '"/></svg>'; };

  /* ── Enlaces que se arman desde CONFIG ── */
  var E = {
    whatsapp:   "https://wa.me/" + digitos(C.whatsapp) + "?text=" + encodeURIComponent(C.mensajeWhatsapp),
    telefono:   "tel:+" + digitos(C.telefono),
    guardia:    "tel:+" + digitos(C.emergencias.telefono),
    correo:     C.correo ? "mailto:" + C.correo : "",
    instagram:  C.instagram ? "https://www.instagram.com/" + encodeURIComponent(String(C.instagram).replace(/^@/, "")) + "/" : "",
    // "Cómo llegar": el enlace de Google Maps de CONFIG.mapa.enlace (si falta, una ruta hacia CONFIG.mapa.busqueda).
    comoLlegar: C.mapa.enlace || ("https://www.google.com/maps/dir/?api=1&destination=" + encodeURIComponent(C.mapa.busqueda || "")),
    mapaEmbed:  "https://www.google.com/maps?q=" + encodeURIComponent(C.mapa.busqueda || "") + "&z=15&output=embed"
  };

  /* ── Identidad ── */
  document.title = C.nombre;
  var metaDesc = $('meta[name="description"]');
  if (metaDesc) metaDesc.setAttribute("content", C.descripcion);

  var h1 = $("#nombre");
  var pos = C.marca ? C.nombre.indexOf(C.marca) : -1;
  if (pos >= 0) {
    var resto = (C.nombre.slice(0, pos) + C.nombre.slice(pos + C.marca.length)).replace(/\s+/g, " ").trim();
    h1.innerHTML = (resto ? '<span class="nombre-linea">' + esc(resto) + "</span> " : "") +
                   '<span class="nombre-marca">' + esc(C.marca) + "</span>";
  } else {
    h1.innerHTML = '<span class="nombre-marca nombre-marca--largo">' + esc(C.nombre) + "</span>";
  }

  /* ── Imágenes reales (si se configuraron) ── */
  if (C.imagenes.hero) {
    $("#marco-hero").innerHTML = '<img src="' + esc(C.imagenes.hero) + '" alt="' + esc(C.imagenes.heroAlt) + '" width="960" height="1200">';
  }

  /* ── Servicios ── */
  $("#lista-servicios").innerHTML = C.servicios.map(function (s, i) {
    return '<li class="servicio' + (s.icono === "emergencia" ? " servicio--emergencia" : "") + '">' +
      '<div class="servicio-cima"><span class="etiqueta">Servicio ' + (i + 1) + "</span>" + icono(s.icono) + "</div>" +
      "<h3>" + esc(s.titulo) + "</h3><p>" + esc(s.texto) + "</p></li>";
  }).join("");

  /* ── Precios ── */
  $("#lista-precios").innerHTML = C.precios.otros.map(function (p) {
    return '<li><span class="concepto">' + esc(p.nombre) + '</span><span class="puntos" aria-hidden="true"></span>' +
      '<span class="monto">' + (p.desde ? "<small>desde</small>" : "") + "<b>" + esc(p.precio) + "</b></span></li>";
  }).join("");

  /* ── Horario ── */
  var aMin = function (hhmm) {
    if (!hhmm) return null;
    var p = String(hhmm).split(":");
    return parseInt(p[0], 10) * 60 + parseInt(p[1] || "0", 10);
  };
  var rango = function (fila) {
    var a = aMin(fila.abre), c = aMin(fila.cierra);
    return (a == null || c == null || isNaN(a) || isNaN(c)) ? null : { abre: a, cierra: c };
  };
  var hora = function (min) {            // 1080 → "6:00 p. m."
    var h = Math.floor(min / 60), m = min % 60;
    return ((h % 12) || 12) + ":" + (m < 10 ? "0" : "") + m + " " + (h < 12 ? "a. m." : "p. m.");
  };
  var aLas = function (min) {            // "a las 6:00 p. m." / "a la 1:00 p. m."
    return ((Math.floor(min / 60) % 12) === 1 ? "a la " : "a las ") + hora(min);
  };
  var textoRango = function (fila) {
    var r = rango(fila);
    return r ? hora(r.abre) + " – " + hora(r.cierra) : "Cerrado";
  };

  // Día (0 = domingo … 6 = sábado) y minutos desde medianoche, en hora local o en CONFIG.zonaHoraria.
  function ahora() {
    var d = new Date();
    if (C.zonaHoraria) {
      try {
        var partes = new Intl.DateTimeFormat("en-US", {
          timeZone: C.zonaHoraria, weekday: "short", hour: "2-digit", minute: "2-digit", hourCycle: "h23"
        }).formatToParts(d);
        var v = {};
        partes.forEach(function (p) { v[p.type] = p.value; });
        var dia = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"].indexOf(v.weekday);
        if (dia >= 0) return { dia: dia, min: (parseInt(v.hour, 10) % 24) * 60 + parseInt(v.minute, 10) };
      } catch (e) { /* zona no válida: se usa la hora local */ }
    }
    return { dia: d.getDay(), min: d.getHours() * 60 + d.getMinutes() };
  }

  // Devuelve { abierto, texto, detalle } para un día y minuto dados.
  function calcularEstado(horario, dia, min) {
    var hoy = (dia + 6) % 7;             // índice en CONFIG.horario (0 = lunes)
    var r = rango(horario[hoy]);
    if (r && min >= r.abre && min < r.cierra) {
      return { abierto: true, texto: "Abierto ahora", detalle: "Cierra " + aLas(r.cierra) };
    }
    for (var k = 0; k <= 7; k++) {
      var i = (hoy + k) % 7, sig = rango(horario[i]);
      if (!sig || (k === 0 && min >= sig.abre)) continue;
      var cuando = k === 0 ? "hoy" : k === 1 ? "mañana" : "el " + String(horario[i].dia).toLowerCase();
      return { abierto: false, texto: "Cerrado", detalle: "Abre " + cuando + " " + aLas(sig.abre) };
    }
    return { abierto: false, texto: "Cerrado", detalle: "" };
  }

  var huellaEstado = "";
  function pintarHorario() {
    var t = ahora(), hoy = (t.dia + 6) % 7, e = calcularEstado(C.horario, t.dia, t.min);
    var huella = hoy + "|" + e.texto + "|" + e.detalle;
    if (huella === huellaEstado) return;   // solo se repinta cuando algo cambia
    huellaEstado = huella;

    $("#tabla-horario").innerHTML = C.horario.map(function (f, i) {
      var clases = (i === hoy ? "hoy " : "") + (rango(f) ? "" : "dia-cerrado");
      return '<tr class="' + clases.trim() + '"><th scope="row">' + esc(f.dia) +
        (i === hoy ? '<span class="chip-hoy">Hoy</span>' : "") + "</th><td>" + textoRango(f) + "</td></tr>";
    }).join("");

    $$("[data-estado]").forEach(function (el) {
      el.classList.toggle("cerrado", !e.abierto);
      el.innerHTML = '<span class="punto" aria-hidden="true"></span><span>' + e.texto +
        (el.dataset.estado === "largo" && e.detalle ? ' <span class="detalle">· ' + e.detalle + "</span>" : "") + "</span>";
    });
    $$("[data-estado-detalle]").forEach(function (el) { el.textContent = e.detalle; });

    var datoHoy = $("#dato-hoy");
    if (datoHoy) datoHoy.textContent = textoRango(C.horario[hoy]);
  }

  /* ── Datos rápidos del hero ── */
  var sinDir = !C.direccion.linea1;
  var dirCorta = sinDir ? C.textos.ubicacion.sinDireccion :
    [String(C.direccion.linea1).split(",")[0], C.direccion.ciudad].filter(Boolean).join(", ");
  var dato = function (href, etiqueta, valor, idValor) {
    return '<a class="dato" href="' + href + '"><span class="etiqueta">' + esc(etiqueta) + "</span>" +
      '<span class="dato-valor"' + (idValor ? ' id="' + idValor + '"' : "") + ">" + esc(valor) + "</span>" +
      icono("flecha") + "</a>";
  };
  $("#datos").innerHTML =
    dato("#precios", C.precios.destacado.nombre, C.precios.destacado.precio) +
    dato("#horario", "Horario de hoy", "", "dato-hoy") +
    dato("#ubicacion", "Dónde estamos", dirCorta);

  pintarHorario();
  setInterval(pintarHorario, 30000);
  document.addEventListener("visibilitychange", function () { if (!document.hidden) pintarHorario(); });

  /* ── Ubicación ── */
  $("#direccion").innerHTML = "<strong>" + esc(sinDir ? C.textos.ubicacion.sinDireccion : C.direccion.linea1) + "</strong>" +
    (C.direccion.ciudad && !sinDir ? "<span>" + esc(C.direccion.ciudad) + "</span>" : "") +
    (C.direccion.referencia ? '<span class="referencia">' + esc(C.direccion.referencia) + "</span>" : "");
  var mapa = $("#mapa");
  if (C.mapa.modo === "iframe") {
    mapa.removeAttribute("data-enlace"); mapa.removeAttribute("aria-label");  // el mapa interactivo ya no es un enlace
    mapa.innerHTML = '<iframe src="' + esc(E.mapaEmbed) + '" title="Mapa de Google Maps con la ubicación de ' + esc(C.nombre) +
      '" loading="lazy" referrerpolicy="no-referrer-when-downgrade" allowfullscreen></iframe>';
  } else if (C.imagenes.ubicacion) {
    mapa.innerHTML = '<img src="' + esc(C.imagenes.ubicacion) + '" alt="' + esc(C.imagenes.ubicacionAlt) + '" width="1280" height="800" loading="lazy">';
  }

  /* ── Contacto ── */
  var contactos = [
    { enlace: "whatsapp",  etiqueta: "WhatsApp",  valor: C.whatsapp },
    { enlace: "telefono",  etiqueta: "Teléfono",  valor: C.telefono },
    { enlace: "correo",    etiqueta: "Correo",    valor: C.correo },
    { enlace: "instagram", etiqueta: "Instagram", valor: C.instagram }
  ];
  $("#lista-contactos").innerHTML = contactos.filter(function (c) { return c.valor; }).map(function (c) {
    return '<li><a class="contacto" data-enlace="' + c.enlace + '"><span class="etiqueta">' + c.etiqueta + "</span>" +
      '<span class="contacto-valor">' + esc(c.valor) + "</span>" + icono("flecha") + "</a></li>";
  }).join("");
  $("#copyright").textContent = "© " + new Date().getFullYear() + " " + C.nombre + ". " + C.textos.derechos;

  /* ── Textos y enlaces marcados en el HTML ── */
  $$("[data-t]").forEach(function (el) {
    var v = el.dataset.t.split(".").reduce(function (o, k) { return o == null ? o : o[k]; }, C);
    if (v != null) el.textContent = v;
  });
  $$("[data-enlace]").forEach(function (a) {
    var href = E[a.dataset.enlace];
    if (!href) return;
    a.setAttribute("href", href);
    if (/^https?:/.test(href)) { a.setAttribute("target", "_blank"); a.setAttribute("rel", "noopener"); }
  });
})();
</script>
</body>
