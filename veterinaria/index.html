<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Clínica Veterinaria Huellitas</title>

<script>
/* ╔══════════════════════════════════════════════════════════════════════╗
   ║  CONFIGURACIÓN — TODO LO EDITABLE DE LA PÁGINA ESTÁ AQUÍ             ║
   ║  Cambia los valores entre comillas y guarda. No hace falta tocar     ║
   ║  nada más: el HTML de abajo se rellena solo a partir de este objeto. ║
   ╚══════════════════════════════════════════════════════════════════════╝ */
const CONFIG = {

  /* ── 1. IDENTIDAD ─────────────────────────────────────────────────── */
  nombre: "Clínica Veterinaria Huellitas",   // Nombre completo (título del hero y pie de página).
  marca:  "Huellitas",                       // Palabra del nombre que se muestra en grande y en el logo.
  frase:  "Cuidamos a quienes te cuidan sin pedir nada a cambio.",
  descripcion: "Consulta veterinaria, vacunación, desparasitación y emergencias en Caracas. Precios claros, horario y ubicación.",
  // ↑ La descripción también está escrita a mano en las metaetiquetas del <head>
  //   (description y Open Graph). Si la cambias aquí, cámbiala allí también:
  //   las vistas previas de WhatsApp o Google no ejecutan JavaScript.

  /* ── 2. CONTACTO ──────────────────────────────────────────────────── */
  telefono:  "+58 212 000 0000",             // Se muestra tal cual; el enlace para llamar se arma solo.
  whatsapp:  "+58 412 000 0000",             // Con código de país. Los espacios no importan.
  mensajeWhatsapp: "Hola, quisiera agendar una cita para mi mascota.",  // Texto que aparece ya escrito al abrir el chat.
  correo:    "contacto@huellitas.example",
  instagram: "@huellitas.vet",

  /* ── 3. SERVICIOS ─────────────────────────────────────────────────── */
  // icono: "consulta" | "vacuna" | "desparasitacion" | "emergencia"
  // La tarjeta con icono "emergencia" se pinta en coral para destacarla.
  servicios: [
    { icono: "consulta",        titulo: "Consulta general", texto: "Revisión completa, diagnóstico y un plan claro de cuidado." },
    { icono: "vacuna",          titulo: "Vacunación",       texto: "Esquema al día para cachorros, gatitos y adultos." },
    { icono: "desparasitacion", titulo: "Desparasitación",  texto: "Protección interna y externa, según peso y edad." },
    { icono: "emergencia",      titulo: "Emergencias",      texto: "Atención prioritaria. Llama antes de venir y te esperamos." }
  ],

  /* ── 4. PRECIOS ───────────────────────────────────────────────────── */
  precios: {
    destacado: {                              // El precio que va dentro de la placa.
      nombre:  "Consulta general",
      precio:  "$25",
      detalle: "Revisión física completa y orientación para el cuidado en casa."
    },
    otros: [                                  // De 2 a 4 filas. desde: true antepone la palabra "desde".
      { nombre: "Vacuna antirrábica", precio: "$15", desde: false },
      { nombre: "Desparasitación",    precio: "$10", desde: true  },
      { nombre: "Baño medicado",      precio: "$20", desde: true  }
    ],
    nota: "Precios de referencia. Pueden variar según el caso; siempre te confirmamos el monto antes de cualquier procedimiento."
  },

  /* ── 5. HORARIO ───────────────────────────────────────────────────── */
  // Siempre 7 filas, en este orden: de lunes a domingo.
  // Horas en formato de 24 h ("08:00", "18:00"). Día cerrado: abre: null, cierra: null.
  horario: [
    { dia: "Lunes",     abre: "08:00", cierra: "18:00" },
    { dia: "Martes",    abre: "08:00", cierra: "18:00" },
    { dia: "Miércoles", abre: "08:00", cierra: "18:00" },
    { dia: "Jueves",    abre: "08:00", cierra: "18:00" },
    { dia: "Viernes",   abre: "08:00", cierra: "18:00" },
    { dia: "Sábado",    abre: "09:00", cierra: "13:00" },
    { dia: "Domingo",   abre: null,    cierra: null    }
  ],
  // El indicador "Abierto ahora / Cerrado" usa la hora local del dispositivo del visitante.
  // Para fijarlo a la hora de la clínica (útil si alguien la abre desde otro país),
  // escribe aquí su zona horaria, por ejemplo "America/Caracas".
  zonaHoraria: "",
  emergencias: {
    texto:    "Emergencias fuera de horario: llama al teléfono de guardia.",
    telefono: "+58 212 000 0000"              // Teléfono de guardia (puede ser distinto al principal).
  },

  /* ── 6. UBICACIÓN ─────────────────────────────────────────────────── */
  direccion: {
    linea1: "Av. Principal, Edificio Ejemplo, Local 3",
    ciudad: "Caracas",
    referencia: ""                            // Opcional: "Frente a la plaza…". Vacío = no se muestra.
  },
  mapa: {
    // Lo que escribirías en el buscador de Google Maps para encontrar la clínica.
    // Puede ser la dirección completa o el nombre del negocio tal como aparece en Maps.
    busqueda: "Caracas, Venezuela",
    // "iframe"  → mapa interactivo de Google Maps embebido.
    // "tarjeta" → ilustración + botón "Cómo llegar" (para sitios donde no se permiten iframes).
    modo: "iframe"
  },

  /* ── 7. IMÁGENES REALES (opcional) ────────────────────────────────── */
  // Deja "" para seguir viendo la ilustración de relleno.
  imagenes: {
    hero:      "",   // Foto principal. Proporción 4:5 (vertical), recomendado 960 × 1200 px. Ej.: "fotos/hero.jpg"
    heroAlt:   "Un perro y un gato sentados juntos",
    ubicacion: "",   // Foto de la fachada (solo se usa con mapa.modo "tarjeta"). Proporción 16:10, 1280 × 800 px.
    ubicacionAlt: "Fachada de la clínica"
  },

  /* ── 8. TEXTOS DE LA PÁGINA ───────────────────────────────────────── */
  textos: {
    botonCita:     "Agendar cita",
    botonWhatsapp: "Escribir por WhatsApp",
    botonLlamar:   "Llamar",
    botonMapa:     "Cómo llegar",
    servicios: { titulo: "Servicios", intro: "Lo esencial para que tu mascota esté sana." },
    precios:   { titulo: "Precios",   intro: "Para que sepas cuánto cuesta antes de venir." },
    horario:   { titulo: "Horario" },
    ubicacion: { titulo: "Ubicación", intro: "Te esperamos aquí." },
    contacto:  { titulo: "Contacto",  intro: "Escríbenos o llámanos. Respondemos en horario de atención." },
    derechos:  "Todos los derechos reservados."
  }
};
/* ═════════════════ FIN DE LA CONFIGURACIÓN ═════════════════ */
</script>

<!-- Fuentes: Fraunces (títulos) e Inter (texto). Si no cargan, se usan las del sistema. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,400..700,0..100;1,9..144,400..700,0..100&family=Inter:wght@400;500;600&display=swap">

<style>
/* Composición: columna central de 1120 px. Hero a dos columnas (texto + ilustración en arco)
   con una franja de datos rápidos debajo; servicios en fila de cuatro; precios y horario
   lado a lado (papel claro junto a verde pino); ubicación a dos columnas; contacto sobre
   una banda salvia que cierra la página. En móvil todo cae a una columna. */
:root {
  /* Color */
  --crema: #F6EFE2;          /* fondo general */
  --arena: #EDE2CD;          /* fondo de apoyo, formas orgánicas */
  --papel: #FFFBF4;          /* tarjetas */
  --pino: #1E4A42;           /* color principal profundo */
  --pino-hondo: #163A33;
  --salvia: #8FAE9B;         /* color principal suave */
  --salvia-clara: #D5E2D3;
  --salvia-niebla: #E6EEE3;
  --coral: #F08B6F;          /* acento: llamados a la acción */
  --coral-vivo: #EC7C5D;
  --coral-hondo: #A93F27;    /* coral para texto sobre fondos claros */
  --coral-claro: #FBE3D9;
  --tinta: #1C2B27;          /* texto principal */
  --tinta-suave: #4D5E58;    /* texto secundario */
  --linea: rgba(30, 74, 66, .14);
  --velo: rgba(246, 239, 226, .12);
  --velo-linea: rgba(246, 239, 226, .22);

  /* Tipografía */
  --f-titulo: "Fraunces", "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  --f-texto: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;

  /* Forma */
  --radio: 24px;
  --radio-s: 14px;
  --sombra: 0 1px 2px rgba(28, 43, 39, .04), 0 10px 28px -14px rgba(28, 43, 39, .14);
  --sombra-alta: 0 2px 4px rgba(28, 43, 39, .05), 0 22px 44px -18px rgba(28, 43, 39, .26);
  --alto-cabecera: 64px;
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-padding-top: calc(var(--alto-cabecera) + 20px); }
body {
  margin: 0;
  background: var(--crema);
  color: var(--tinta);
  font-family: var(--f-texto);
  font-size: 1.0625rem;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
/* Pinta la franja de la barra de estado en teléfonos con muesca. */
body::before {
  content: ""; position: fixed; inset: 0 0 auto; z-index: 30;
  height: env(safe-area-inset-top, 0px); background: var(--crema);
}
img, svg { display: block; max-width: 100%; }
a { color: inherit; }
h1, h2, h3, p, ul, table { margin: 0; }
ul { padding: 0; list-style: none; }
:focus-visible { outline: 3px solid var(--coral-hondo); outline-offset: 3px; border-radius: 6px; }

.solo-lectores {
  position: absolute; width: 1px; height: 1px; overflow: hidden;
  clip-path: inset(50%); white-space: nowrap;
}
.saltar {
  position: absolute; left: 16px; top: -80px; z-index: 50;
  background: var(--pino); color: var(--papel); padding: 10px 16px; border-radius: 10px;
}
.saltar:focus { top: calc(env(safe-area-inset-top, 0px) + 12px); }

.envoltura {
  width: 100%; max-width: 1160px; margin-inline: auto;
  padding-left: max(20px, env(safe-area-inset-left, 0px));
  padding-right: max(20px, env(safe-area-inset-right, 0px));
}
.seccion { padding-block: clamp(44px, 6.5vw, 84px); }

/* ── Tipografía ── */
.titulo {
  font-family: var(--f-titulo);
  font-variation-settings: "SOFT" 100;
  font-weight: 500;
  font-size: clamp(1.9rem, 4.2vw, 2.6rem);
  line-height: 1.1;
  letter-spacing: -.015em;
  color: var(--pino);
  text-wrap: balance;
}
.intro { color: var(--tinta-suave); max-width: 46ch; margin-top: 10px; }
.icono { width: 22px; height: 22px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* ── Botones ── */
.boton {
  display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  min-height: 54px; padding: 0 26px;
  border: 1.5px solid transparent; border-radius: 999px;
  font: 600 1rem/1 var(--f-texto); text-decoration: none; white-space: nowrap;
  cursor: pointer;
  transition: transform .2s ease, box-shadow .2s ease, background-color .2s ease, color .2s ease;
}
.boton:hover { transform: translateY(-2px); }
.boton:active { transform: translateY(0); }
.boton--coral { background: var(--coral); color: var(--tinta); box-shadow: 0 8px 20px -10px rgba(169, 63, 39, .55); }
.boton--coral:hover { background: var(--coral-vivo); box-shadow: 0 14px 26px -12px rgba(169, 63, 39, .6); }
.boton--pino { background: var(--pino); color: var(--papel); }
.boton--pino:hover { background: var(--pino-hondo); box-shadow: var(--sombra-alta); }
.boton--linea { border-color: var(--pino); color: var(--pino); background: transparent; }
.boton--linea:hover { background: var(--pino); color: var(--papel); }
.boton--chico { min-height: 44px; padding: 0 20px; font-size: .9375rem; }
.boton .flecha { transition: transform .2s ease; }
.boton:hover .flecha { transform: translate(2px, -2px); }

/* ── 1. Encabezado ── */
.cabecera {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: rgba(246, 239, 226, .86);
  -webkit-backdrop-filter: saturate(1.4) blur(14px); backdrop-filter: saturate(1.4) blur(14px);
  border-bottom: 1px solid transparent;
  transition: border-color .3s ease, box-shadow .3s ease;
}
.cabecera.con-borde { border-bottom-color: var(--linea); box-shadow: 0 10px 30px -24px rgba(28, 43, 39, .5); }
.cabecera .envoltura { display: flex; align-items: center; justify-content: space-between; gap: 20px; min-height: var(--alto-cabecera); }
.logo {
  display: inline-flex; align-items: center; gap: 10px; text-decoration: none;
  font-family: var(--f-titulo); font-variation-settings: "SOFT" 100; font-weight: 600;
  font-size: 1.3rem; letter-spacing: -.01em; color: var(--pino);
}
.logo-marca { width: 34px; height: 34px; border-radius: 11px; background: var(--pino); display: grid; place-items: center; transition: transform .3s ease; }
.logo-marca svg { width: 20px; height: 20px; fill: var(--crema); }
.logo:hover .logo-marca { transform: rotate(-10deg); }
.nav { display: none; }
.nav ul { display: flex; gap: 6px; }
.nav a {
  display: inline-block; padding: 10px 12px; border-radius: 10px;
  font-size: .9375rem; font-weight: 500; color: var(--tinta-suave); text-decoration: none;
  background: linear-gradient(var(--coral), var(--coral)) no-repeat 12px calc(100% - 6px) / 0 2px;
  transition: color .2s ease, background-size .25s ease;
}
.nav a:hover { color: var(--tinta); background-size: calc(100% - 24px) 2px; }
@media (min-width: 900px) { .nav { display: block; } }

/* ── 2. Hero ── */
.hero { position: relative; overflow: hidden; overflow: clip; padding-block: clamp(24px, 4.5vw, 52px) clamp(36px, 5vw, 60px); }
.hero::before, .hero::after { content: ""; position: absolute; z-index: 0; pointer-events: none; }
.hero::before { /* forma orgánica salvia detrás de la ilustración */
  width: min(92vw, 640px); aspect-ratio: 1; right: -12%; top: -6%;
  background: var(--salvia-niebla); border-radius: 58% 42% 55% 45% / 48% 56% 44% 52%;
}
.hero::after { /* forma orgánica arena, abajo a la izquierda */
  width: min(64vw, 400px); aspect-ratio: 1.25; left: -12%; bottom: 3%;
  background: var(--arena); border-radius: 45% 55% 40% 60% / 55% 45% 55% 45%; opacity: .7;
}
.hero-rejilla {
  position: relative; z-index: 1;
  display: grid; gap: 30px; grid-template-columns: minmax(0, 1fr);
  grid-template-areas: "texto" "arte" "datos";
}
.hero-texto { grid-area: texto; display: flex; flex-direction: column; align-items: flex-start; gap: 20px; min-width: 0; }
.hero-arte { grid-area: arte; position: relative; }
.datos { grid-area: datos; }

.estado {
  display: inline-flex; align-items: center; gap: 10px;
  padding: 7px 14px 7px 12px; border-radius: 999px;
  font-size: .875rem; font-weight: 600; line-height: 1.3;
  background: var(--salvia-clara); color: var(--pino-hondo);
}
.estado .punto { position: relative; width: 9px; height: 9px; border-radius: 50%; background: #2E7D5B; flex: none; }
.estado .punto::after { content: ""; position: absolute; inset: 0; border-radius: 50%; background: inherit; animation: latido 2.2s ease-out infinite; }
.estado .detalle { font-weight: 500; }
.estado.cerrado { background: var(--coral-claro); color: #7C2A17; }
.estado.cerrado .punto { background: var(--coral-hondo); }
.estado.cerrado .punto::after { animation: none; }
@keyframes latido { from { transform: scale(1); opacity: .6; } to { transform: scale(3); opacity: 0; } }

.nombre { display: flex; flex-direction: column; gap: 2px; color: var(--pino); font-family: var(--f-titulo); font-variation-settings: "SOFT" 100; }
.nombre-linea { font-size: clamp(1.3rem, 2.8vw, 1.8rem); font-weight: 400; letter-spacing: -.005em; line-height: 1.2; }
.nombre-marca {
  font-size: clamp(3.4rem, 17vw, 7.25rem); font-weight: 500; font-style: italic;
  line-height: .95; letter-spacing: -.035em; overflow-wrap: anywhere; padding-bottom: .08em;
}
.nombre-marca--largo { font-size: clamp(2.4rem, 8vw, 4.4rem); font-style: normal; line-height: 1.02; }
.frase { font-size: clamp(1.1rem, 2.1vw, 1.3rem); line-height: 1.45; color: var(--tinta-suave); max-width: 30ch; text-wrap: balance; }
.hero-botones { display: flex; flex-wrap: wrap; gap: 12px; width: 100%; margin-top: 6px; }
.hero-botones .boton { flex: 1 1 200px; }

/* Marco en arco: aquí va la foto principal (proporción 4:5). */
.marco {
  width: min(70%, 290px); aspect-ratio: 4 / 5; margin-inline: auto;
  border-radius: 50% 50% 30px 30px / 40% 40% 30px 30px; overflow: hidden;
  background: var(--salvia-clara); box-shadow: var(--sombra-alta);
}
.marco > svg, .marco > img { width: 100%; height: 100%; object-fit: cover; }
.rastro { position: absolute; inset: 0; pointer-events: none; }
.rastro svg { position: absolute; width: 30px; height: 30px; fill: var(--salvia); opacity: .5; }
.rastro svg:nth-child(1) { left: 2%;  bottom: 6%;  transform: rotate(38deg); }
.rastro svg:nth-child(2) { left: 9%;  bottom: 24%; transform: rotate(22deg); }
.rastro svg:nth-child(3) { left: 1%;  bottom: 42%; transform: rotate(30deg); opacity: .32; }
.rastro svg:nth-child(4) { right: 3%; top: 8%;     transform: rotate(-24deg); opacity: .32; }

/* Ilustración de relleno */
.i-cielo { fill: var(--salvia-clara); } .i-sol { fill: var(--coral); } .i-suelo { fill: var(--salvia); }
.i-hoja { fill: #6F957F; } .i-pino { fill: var(--pino); } .i-pino-hondo { fill: var(--pino-hondo); }
.i-crema { fill: var(--papel); } .i-arena { fill: var(--arena); } .i-tinta { fill: var(--tinta); } .i-coral { fill: var(--coral); }
.i-trazo-tinta { fill: none; stroke: var(--tinta); stroke-width: 2.6; stroke-linecap: round; }
.i-trazo-crema { fill: none; stroke: var(--papel); stroke-linecap: round; }
.i-trazo-pino { fill: none; stroke: var(--pino); stroke-linecap: round; }
.i-collar { fill: none; stroke: var(--coral); stroke-width: 11; stroke-linecap: round; }

/* Datos rápidos: lo que el cliente quiere saber, en una franja. */
.datos {
  display: grid; grid-template-columns: minmax(0, 1fr);
  background: var(--papel); border: 1px solid var(--linea); border-radius: var(--radio); box-shadow: var(--sombra);
  overflow: hidden;
}
.dato {
  display: flex; align-items: center; gap: 14px; padding: 16px 20px; min-width: 0;
  text-decoration: none; transition: background-color .2s ease;
}
.dato + .dato { border-top: 1px solid var(--linea); }
.dato:hover { background: var(--salvia-niebla); }
.dato-icono { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; flex: none; background: var(--salvia-niebla); color: var(--pino); transition: background-color .2s ease; }
.dato:hover .dato-icono { background: var(--papel); }
.dato-texto { display: flex; flex-direction: column; min-width: 0; }
.dato-etiqueta { font-size: .8125rem; font-weight: 500; color: var(--tinta-suave); }
.dato-valor { font-weight: 600; color: var(--tinta); line-height: 1.3; font-variant-numeric: tabular-nums; }
.dato .flecha { margin-left: auto; color: var(--salvia); transition: transform .2s ease, color .2s ease; }
.dato:hover .flecha { transform: translate(2px, -2px); color: var(--pino); }

@media (min-width: 620px) {
  .hero-botones .boton { flex: 0 1 auto; }
  .datos { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .dato + .dato { border-top: 0; border-left: 1px solid var(--linea); }
}
@media (min-width: 900px) {
  .hero-rejilla { grid-template-columns: minmax(0, 1.15fr) minmax(0, .85fr); grid-template-areas: "texto arte" "datos datos"; align-items: center; gap: 40px 56px; }
  .hero-texto { gap: 22px; }
  .marco { width: min(100%, 352px); }
  .rastro svg { width: 34px; height: 34px; }
  .rastro svg:nth-child(1) { left: -16%; bottom: 2%; }
  .rastro svg:nth-child(2) { left: -7%;  bottom: 17%; }
  .rastro svg:nth-child(3) { left: -15%; bottom: 33%; }
}

/* ── 3. Servicios ── */
.servicios { display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr); margin-top: 30px; }
.servicio {
  display: grid; grid-template-columns: auto minmax(0, 1fr); column-gap: 16px; row-gap: 2px; align-items: center;
  padding: 18px 20px; background: var(--papel); border: 1px solid var(--linea); border-radius: var(--radio);
  box-shadow: var(--sombra);
  transition: transform .3s cubic-bezier(.2, .7, .2, 1), box-shadow .3s ease, border-color .3s ease;
}
.servicio:hover { transform: translateY(-5px); box-shadow: var(--sombra-alta); border-color: transparent; }
.servicio-icono {
  grid-row: span 2; width: 52px; height: 52px; border-radius: 18px; display: grid; place-items: center;
  background: var(--salvia-niebla); color: var(--pino);
  transition: background-color .3s ease, color .3s ease, transform .3s cubic-bezier(.2, .7, .2, 1);
}
.servicio-icono .icono { width: 26px; height: 26px; }
.servicio:hover .servicio-icono { background: var(--pino); color: var(--papel); transform: rotate(-6deg) scale(1.04); }
.servicio h3 { font: 600 1.0625rem/1.3 var(--f-texto); color: var(--tinta); align-self: end; }
.servicio p { font-size: .9375rem; line-height: 1.5; color: var(--tinta-suave); align-self: start; }
.servicio--emergencia .servicio-icono { background: var(--coral-claro); color: var(--coral-hondo); }
.servicio--emergencia:hover .servicio-icono { background: var(--coral); color: var(--tinta); }
@media (min-width: 620px) { .servicios { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (min-width: 980px) {
  .servicios { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 18px; }
  .servicio { grid-template-columns: minmax(0, 1fr); row-gap: 8px; padding: 26px 24px 28px; align-content: start; }
  .servicio-icono { grid-row: auto; margin-bottom: 10px; }
}

/* ── 4 y 5. Precios + Horario ── */
.duo { display: grid; gap: 18px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 900px) { .duo { grid-template-columns: minmax(0, 1.08fr) minmax(0, .92fr); gap: 22px; } }
.panel { border-radius: calc(var(--radio) + 6px); padding: clamp(24px, 4vw, 40px); min-width: 0; display: flex; flex-direction: column; }
.panel--precios { background: var(--papel); border: 1px solid var(--linea); box-shadow: var(--sombra); }
.panel--horario { background: var(--pino); color: var(--salvia-clara); position: relative; overflow: hidden; }
.panel--horario .titulo { color: var(--papel); }

.destacado { display: flex; flex-wrap: wrap; align-items: center; gap: 18px 28px; margin-top: 34px; }
.destacado-texto { flex: 1 1 200px; min-width: 0; }
.destacado-texto h3 { font: 500 1.5rem/1.2 var(--f-titulo); font-variation-settings: "SOFT" 100; color: var(--pino); }
.destacado-texto p { font-size: .9375rem; color: var(--tinta-suave); margin-top: 6px; max-width: 32ch; }
/* Placa de collar con el precio destacado */
.placa {
  position: relative; flex: none; width: 138px; height: 138px; border-radius: 50%; margin-top: 14px;
  display: grid; place-items: center;
  background: var(--coral); color: var(--tinta);
  box-shadow: inset 0 -6px 0 rgba(169, 63, 39, .22), 0 14px 26px -14px rgba(169, 63, 39, .7);
  transform: rotate(-7deg); transform-origin: 50% -10px;
}
.placa::before { /* orificio */ content: ""; position: absolute; top: 11px; left: 50%; width: 15px; height: 15px; margin-left: -7.5px; border-radius: 50%; background: var(--papel); box-shadow: inset 0 2px 0 rgba(28, 43, 39, .18); }
.placa::after { /* argolla */ content: ""; position: absolute; top: -17px; left: 50%; width: 30px; height: 36px; margin-left: -15px; border-radius: 50%; border: 3.5px solid var(--pino); border-bottom-color: transparent; }
.placa-precio { font: 600 3.1rem/1 var(--f-titulo); font-variation-settings: "SOFT" 100; letter-spacing: -.03em; padding-top: 12px; font-variant-numeric: lining-nums; }
.panel--precios:hover .placa { animation: balanceo 1.5s ease-in-out; }
@keyframes balanceo { 0%, 100% { transform: rotate(-7deg); } 22% { transform: rotate(7deg); } 46% { transform: rotate(-11deg); } 70% { transform: rotate(-3deg); } }

.lista-precios { margin-top: 30px; border-top: 1px solid var(--linea); }
.lista-precios li { display: flex; align-items: baseline; gap: 10px; padding: 14px 0; border-bottom: 1px solid var(--linea); }
.lista-precios .concepto { font-weight: 500; }
.lista-precios .puntos { flex: 1; min-width: 16px; border-bottom: 2px dotted var(--salvia); transform: translateY(-4px); }
.lista-precios .monto { white-space: nowrap; font-variant-numeric: tabular-nums; }
.lista-precios .monto small { font-size: .875rem; color: var(--tinta-suave); margin-right: 4px; }
.lista-precios .monto b { font: 600 1.3rem/1 var(--f-titulo); font-variation-settings: "SOFT" 100; color: var(--pino); }
.nota { margin-top: auto; padding-top: 20px; font-size: .875rem; line-height: 1.5; color: var(--tinta-suave); }

.horario-cabeza { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 16px; }
.horario-detalle { margin-top: 8px; min-height: 1.6em; font-size: .9375rem; color: var(--salvia-clara); }
.tabla-horario { width: 100%; margin-top: 18px; border-collapse: separate; border-spacing: 0 2px; font-variant-numeric: tabular-nums; }
.tabla-horario th, .tabla-horario td { padding: 9px 12px; font-size: clamp(.9375rem, 3.9vw, 1rem); line-height: 1.4; }
.tabla-horario th { text-align: left; font-weight: 500; border-radius: 12px 0 0 12px; white-space: nowrap; }
.tabla-horario td { text-align: right; border-radius: 0 12px 12px 0; white-space: nowrap; }
.tabla-horario .dia-cerrado td { font-style: italic; }
.tabla-horario .hoy th, .tabla-horario .hoy td { background: var(--velo); color: var(--papel); font-weight: 600; }
.chip-hoy { display: inline-block; margin-left: 7px; padding: 2px 8px; border-radius: 999px; background: var(--coral); color: var(--tinta); font-size: .75rem; font-weight: 600; letter-spacing: .02em; vertical-align: 2px; }
.guardia { display: flex; gap: 14px; align-items: flex-start; margin-top: auto; padding-top: 22px; }
.guardia-cuerpo { border-top: 1px solid var(--velo-linea); padding-top: 18px; display: flex; gap: 14px; align-items: flex-start; width: 100%; font-size: .9375rem; line-height: 1.5; }
.guardia .icono { color: var(--coral); margin-top: 2px; }
.guardia a { display: inline-block; color: var(--papel); font-weight: 600; white-space: nowrap; text-decoration: underline; text-decoration-color: var(--coral); text-decoration-thickness: 2px; text-underline-offset: 4px; padding-block: 4px; }
.guardia a:hover { color: var(--coral); }
.panel--horario .huella-fondo { position: absolute; right: -34px; bottom: -40px; width: 190px; height: 190px; fill: var(--papel); opacity: .045; transform: rotate(-18deg); pointer-events: none; }
.panel--horario > *:not(.huella-fondo) { position: relative; }

/* ── 6. Ubicación ── */
.ubicacion { display: grid; gap: 26px; grid-template-columns: minmax(0, 1fr); align-items: center; }
.direccion { font-style: normal; margin-top: 18px; font-size: 1.125rem; line-height: 1.5; }
.direccion strong { display: block; font-weight: 600; }
.direccion .referencia { display: block; margin-top: 6px; font-size: .9375rem; color: var(--tinta-suave); }
.ubicacion .boton { margin-top: 24px; }
.mapa {
  position: relative; aspect-ratio: 4 / 3; width: 100%; max-width: 100%;
  border-radius: calc(var(--radio) + 6px); overflow: hidden;
  background: var(--arena); border: 1px solid var(--linea); box-shadow: var(--sombra);
}
.mapa > iframe, .mapa > svg, .mapa > img { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; object-fit: cover; }
.m-base { fill: var(--arena); } .m-manzana { fill: var(--crema); } .m-parque { fill: var(--salvia-clara); } .m-agua { fill: #C9DCD8; }
.m-calle { fill: none; stroke: var(--papel); stroke-linecap: round; } .m-pin { fill: var(--coral); } .m-pin-centro { fill: var(--papel); } .m-sombra { fill: rgba(28, 43, 39, .16); }
.m-pulso { fill: none; stroke: var(--coral); stroke-width: 2; opacity: .5; transform-origin: 330px 232px; animation: onda 2.8s ease-out infinite; }
@keyframes onda { from { transform: scale(.5); opacity: .7; } to { transform: scale(2.4); opacity: 0; } }
@media (min-width: 900px) {
  .ubicacion { grid-template-columns: minmax(0, .8fr) minmax(0, 1.2fr); gap: 56px; }
  .mapa { aspect-ratio: 16 / 10; }
}

/* ── 7. Contacto y pie ── */
.cierre { position: relative; background: var(--salvia-niebla); margin-top: clamp(40px, 6vw, 64px); }
.cierre-onda { position: absolute; left: 0; bottom: calc(100% - 1px); width: 100%; height: clamp(28px, 5vw, 56px); fill: var(--salvia-niebla); }
.cierre .seccion { padding-top: clamp(28px, 4vw, 48px); padding-bottom: clamp(36px, 5vw, 56px); }
.contactos { display: grid; gap: 12px; grid-template-columns: minmax(0, 1fr); margin-top: 28px; }
.contactos li { display: flex; min-width: 0; }
.contacto {
  display: flex; flex: 1; align-items: center; gap: 14px; min-height: 84px; padding: 16px 18px; min-width: 0;
  background: var(--papel); border: 1px solid var(--linea); border-radius: var(--radio); text-decoration: none;
  transition: transform .3s cubic-bezier(.2, .7, .2, 1), box-shadow .3s ease, border-color .3s ease;
}
.contacto:hover { transform: translateY(-4px); box-shadow: var(--sombra-alta); border-color: transparent; }
.contacto-icono { width: 50px; height: 50px; border-radius: 50%; display: grid; place-items: center; flex: none; background: var(--pino); color: var(--papel); transition: background-color .3s ease, color .3s ease; }
.contacto:hover .contacto-icono { background: var(--coral); color: var(--tinta); }
.contacto-texto { display: flex; flex-direction: column; min-width: 0; }
.contacto-etiqueta { font-size: .8125rem; font-weight: 500; color: var(--tinta-suave); }
.contacto-valor { font-weight: 600; line-height: 1.3; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
@media (min-width: 620px) { .contactos { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; } }
@media (min-width: 1040px) { .contactos { grid-template-columns: repeat(4, minmax(0, 1fr)); } }

.pie { border-top: 1px solid var(--linea); }
.pie .envoltura { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 24px; padding-block: 22px; font-size: .875rem; color: var(--tinta-suave); }
.pie .logo { font-size: 1.1rem; }
.pie .logo-marca { width: 28px; height: 28px; border-radius: 9px; }
.pie .logo-marca svg { width: 16px; height: 16px; }

/* ── Barra fija en móvil: WhatsApp y Llamar a un toque ── */
.barra-movil {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 25;
  display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
  padding: 10px max(14px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(14px, env(safe-area-inset-left, 0px));
  background: rgba(255, 251, 244, .92);
  -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
  border-top: 1px solid var(--linea); box-shadow: 0 -12px 30px -20px rgba(28, 43, 39, .45);
}
.barra-movil .boton { min-height: 52px; padding: 0 12px; }
@media (max-width: 719.98px) { .pie .envoltura { padding-bottom: calc(22px + 76px + env(safe-area-inset-bottom, 0px)); } }
@media (min-width: 720px) { .barra-movil { display: none; } }

/* ── Movimiento ── */
@media (prefers-reduced-motion: no-preference) {
  html { scroll-behavior: smooth; }
  .entra { animation: entrar .8s cubic-bezier(.2, .7, .2, 1) both; animation-delay: calc(var(--i, 0) * 90ms); }
  @keyframes entrar { from { opacity: 0; transform: translateY(16px); } }
  /* Aparición al hacer scroll: el JS solo oculta lo que está fuera de pantalla al cargar. */
  .pendiente { opacity: 0; transform: translateY(24px); }
  .pendiente.visible { opacity: 1; transform: none; transition: opacity .8s ease, transform .8s cubic-bezier(.2, .7, .2, 1); transition-delay: calc(var(--i, 0) * 80ms); }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

  <div class="seccion" style="padding-top:0">

  <!-- ═════════ 6. UBICACIÓN ═════════ -->
  <section class="seccion" id="ubicacion" aria-labelledby="t-ubicacion" style="padding-top:0">
    <div class="envoltura ubicacion">
      <div data-aparece>
        <h2 class="titulo" id="t-ubicacion" data-t="textos.ubicacion.titulo"></h2>

            <rect x="36" y="136" width="120" height="110" rx="14"/><rect x="184" y="136" width="96" height="110" rx="14"/>

<noscript><p style="padding:24px;text-align:center">Esta página necesita JavaScript para mostrar la información de la clínica.</p></noscript>

<script>
/* ═════════ LÓGICA DE LA PÁGINA (no hace falta editarla) ═════════ */
(function () {
  "use strict";
  var C = CONFIG;
  var $ = function (s) { return document.querySelector(s); };
  var $$ = function (s) { return Array.prototype.slice.call(document.querySelectorAll(s)); };
  var esc = function (s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (ch) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch];
    });
  };
  var digitos = function (s) { return String(s).replace(/\D/g, ""); };
  var icono = function (id, extra) { return '<svg class="icono ' + (extra || "") + '" aria-hidden="true"><use href="#i-' + id + '"/></svg>'; };

  /* ── Enlaces que se arman desde CONFIG ── */
  var E = {
    whatsapp:   "https://wa.me/" + digitos(C.whatsapp) + "?text=" + encodeURIComponent(C.mensajeWhatsapp),
    telefono:   "tel:+" + digitos(C.telefono),
    guardia:    "tel:+" + digitos(C.emergencias.telefono),
    correo:     "mailto:" + C.correo,
    instagram:  "https://www.instagram.com/" + encodeURIComponent(String(C.instagram).replace(/^@/, "")) + "/",
    comoLlegar: "https://www.google.com/maps/dir/?api=1&destination=" + encodeURIComponent(C.mapa.busqueda),
    mapaEmbed:  "https://www.google.com/maps?q=" + encodeURIComponent(C.mapa.busqueda) + "&z=15&output=embed"
  };

  /* ── Identidad ── */
  document.title = C.nombre;
  var metaDesc = $('meta[name="description"]');
  if (metaDesc) metaDesc.setAttribute("content", C.descripcion);

  var h1 = $("#nombre");
  var pos = C.marca ? C.nombre.indexOf(C.marca) : -1;
  if (pos >= 0) {
    var resto = (C.nombre.slice(0, pos) + C.nombre.slice(pos + C.marca.length)).replace(/\s+/g, " ").trim();
    h1.innerHTML = (resto ? '<span class="nombre-linea">' + esc(resto) + "</span> " : "") +
                   '<span class="nombre-marca">' + esc(C.marca) + "</span>";
  } else {
    h1.innerHTML = '<span class="nombre-marca nombre-marca--largo">' + esc(C.nombre) + "</span>";
  }

  /* ── Imágenes reales (si se configuraron) ── */
  if (C.imagenes.hero) {
    $("#marco-hero").innerHTML = '<img src="' + esc(C.imagenes.hero) + '" alt="' + esc(C.imagenes.heroAlt) + '" width="960" height="1200">';
  }

  /* ── Servicios ── */
  $("#lista-servicios").innerHTML = C.servicios.map(function (s, i) {
    return '<li class="servicio' + (s.icono === "emergencia" ? " servicio--emergencia" : "") + '" data-aparece style="--i:' + i + '">' +
      '<span class="servicio-icono">' + icono(s.icono) + "</span>" +
      "<h3>" + esc(s.titulo) + "</h3><p>" + esc(s.texto) + "</p></li>";
  }).join("");

  /* ── Precios ── */
  $("#lista-precios").innerHTML = C.precios.otros.map(function (p) {
    return '<li><span class="concepto">' + esc(p.nombre) + '</span><span class="puntos" aria-hidden="true"></span>' +
      '<span class="monto">' + (p.desde ? "<small>desde</small>" : "") + "<b>" + esc(p.precio) + "</b></span></li>";
  }).join("");

  /* ── Horario ── */
  var aMin = function (hhmm) {
    if (!hhmm) return null;
    var p = String(hhmm).split(":");
    return parseInt(p[0], 10) * 60 + parseInt(p[1] || "0", 10);
  };
  var rango = function (fila) {
    var a = aMin(fila.abre), c = aMin(fila.cierra);
    return (a == null || c == null || isNaN(a) || isNaN(c)) ? null : { abre: a, cierra: c };
  };
  var hora = function (min) {            // 1080 → "6:00 p. m."
    var h = Math.floor(min / 60), m = min % 60;
    return ((h % 12) || 12) + ":" + (m < 10 ? "0" : "") + m + " " + (h < 12 ? "a. m." : "p. m.");
  };
  var aLas = function (min) {            // "a las 6:00 p. m." / "a la 1:00 p. m."
    return ((Math.floor(min / 60) % 12) === 1 ? "a la " : "a las ") + hora(min);
  };
  var textoRango = function (fila) {
    var r = rango(fila);
    return r ? hora(r.abre) + " – " + hora(r.cierra) : "Cerrado";
  };

  // Día (0 = domingo … 6 = sábado) y minutos desde medianoche, en hora local o en CONFIG.zonaHoraria.
  function ahora() {
    var d = new Date();
    if (C.zonaHoraria) {
      try {
        var partes = new Intl.DateTimeFormat("en-US", {
          timeZone: C.zonaHoraria, weekday: "short", hour: "2-digit", minute: "2-digit", hourCycle: "h23"
        }).formatToParts(d);
        var v = {};
        partes.forEach(function (p) { v[p.type] = p.value; });
        var dia = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"].indexOf(v.weekday);
        if (dia >= 0) return { dia: dia, min: (parseInt(v.hour, 10) % 24) * 60 + parseInt(v.minute, 10) };
      } catch (e) { /* zona no válida: se usa la hora local */ }
    }
    return { dia: d.getDay(), min: d.getHours() * 60 + d.getMinutes() };
  }

  // Devuelve { abierto, texto, detalle } para un día y minuto dados.
  function calcularEstado(horario, dia, min) {
    var hoy = (dia + 6) % 7;             // índice en CONFIG.horario (0 = lunes)
    var r = rango(horario[hoy]);
    if (r && min >= r.abre && min < r.cierra) {
      return { abierto: true, texto: "Abierto ahora", detalle: "Cierra " + aLas(r.cierra) };
    }
    for (var k = 0; k <= 7; k++) {
      var i = (hoy + k) % 7, sig = rango(horario[i]);
      if (!sig || (k === 0 && min >= sig.abre)) continue;
      var cuando = k === 0 ? "hoy" : k === 1 ? "mañana" : "el " + String(horario[i].dia).toLowerCase();
      return { abierto: false, texto: "Cerrado", detalle: "Abre " + cuando + " " + aLas(sig.abre) };
    }
    return { abierto: false, texto: "Cerrado", detalle: "" };
  }

  var huellaEstado = "";
  function pintarHorario() {
    var t = ahora(), hoy = (t.dia + 6) % 7, e = calcularEstado(C.horario, t.dia, t.min);
    var huella = hoy + "|" + e.texto + "|" + e.detalle;
    if (huella === huellaEstado) return;   // solo se repinta cuando algo cambia
    huellaEstado = huella;

    $("#tabla-horario").innerHTML = C.horario.map(function (f, i) {
      var clases = (i === hoy ? "hoy " : "") + (rango(f) ? "" : "dia-cerrado");
      return '<tr class="' + clases.trim() + '"><th scope="row">' + esc(f.dia) +
        (i === hoy ? '<span class="chip-hoy">Hoy</span>' : "") + "</th><td>" + textoRango(f) + "</td></tr>";
    }).join("");

    $$("[data-estado]").forEach(function (el) {
      el.classList.toggle("cerrado", !e.abierto);
      el.innerHTML = '<span class="punto" aria-hidden="true"></span><span>' + e.texto +
        (el.dataset.estado === "largo" && e.detalle ? ' <span class="detalle">· ' + e.detalle + "</span>" : "") + "</span>";
    });
    $$("[data-estado-detalle]").forEach(function (el) { el.textContent = e.detalle; });

    var datoHoy = $("#dato-hoy");
    if (datoHoy) datoHoy.textContent = textoRango(C.horario[hoy]);
  }

  /* ── Datos rápidos del hero ── */
  var dirCorta = String(C.direccion.linea1).split(",")[0] + ", " + C.direccion.ciudad;
  var dato = function (href, ic, etiqueta, valor, idValor) {
    return '<a class="dato" href="' + href + '"><span class="dato-icono">' + icono(ic) + '</span>' +
      '<span class="dato-texto"><span class="dato-etiqueta">' + esc(etiqueta) + '</span>' +
      '<span class="dato-valor"' + (idValor ? ' id="' + idValor + '"' : "") + ">" + esc(valor) + "</span></span>" +
      icono("flecha", "flecha") + "</a>";
  };
  $("#datos").innerHTML =
    dato("#precios", "precio", C.precios.destacado.nombre, C.precios.destacado.precio) +
    dato("#horario", "reloj", "Horario de hoy", "", "dato-hoy") +
    dato("#ubicacion", "pin", "Dónde estamos", dirCorta);

  pintarHorario();
  setInterval(pintarHorario, 30000);
  document.addEventListener("visibilitychange", function () { if (!document.hidden) pintarHorario(); });

  /* ── Ubicación ── */
  $("#direccion").innerHTML = "<strong>" + esc(C.direccion.linea1) + "</strong>" + esc(C.direccion.ciudad) +
    (C.direccion.referencia ? '<span class="referencia">' + esc(C.direccion.referencia) + "</span>" : "");
  var mapa = $("#mapa");
  if (C.mapa.modo === "iframe") {
    mapa.innerHTML = '<iframe src="' + esc(E.mapaEmbed) + '" title="Mapa de Google Maps con la ubicación de ' + esc(C.nombre) +
      '" loading="lazy" referrerpolicy="no-referrer-when-downgrade" allowfullscreen></iframe>';
  } else if (C.imagenes.ubicacion) {
    mapa.innerHTML = '<img src="' + esc(C.imagenes.ubicacion) + '" alt="' + esc(C.imagenes.ubicacionAlt) + '" width="1280" height="800" loading="lazy">';
  }

  /* ── Contacto ── */
  var contactos = [
    { enlace: "whatsapp",  ic: "whatsapp",  etiqueta: "WhatsApp",  valor: C.whatsapp },
    { enlace: "telefono",  ic: "telefono",  etiqueta: "Teléfono",  valor: C.telefono },
    { enlace: "correo",    ic: "correo",    etiqueta: "Correo",    valor: C.correo },
    { enlace: "instagram", ic: "instagram", etiqueta: "Instagram", valor: C.instagram }
  ];
  $("#lista-contactos").innerHTML = contactos.map(function (c, i) {
    return '<li data-aparece style="--i:' + i + '"><a class="contacto" data-enlace="' + c.enlace + '">' +
      '<span class="contacto-icono">' + icono(c.ic) + '</span><span class="contacto-texto">' +
      '<span class="contacto-etiqueta">' + c.etiqueta + '</span><span class="contacto-valor">' + esc(c.valor) + "</span></span></a></li>";
  }).join("");
  $("#copyright").textContent = "© " + new Date().getFullYear() + " " + C.nombre + ". " + C.textos.derechos;

  /* ── Textos y enlaces marcados en el HTML ── */
  $$("[data-t]").forEach(function (el) {
    var v = el.dataset.t.split(".").reduce(function (o, k) { return o == null ? o : o[k]; }, C);
    if (v != null) el.textContent = v;
  });
  $$("[data-enlace]").forEach(function (a) {
    var href = E[a.dataset.enlace];
    if (!href) return;
    a.setAttribute("href", href);
    if (/^https?:/.test(href)) { a.setAttribute("target", "_blank"); a.setAttribute("rel", "noopener"); }
  });

  /* ── Encabezado: línea sutil al hacer scroll ── */
  var cabecera = $("#cabecera");
  var alDesplazar = function () { cabecera.classList.toggle("con-borde", window.scrollY > 8); };
  window.addEventListener("scroll", alDesplazar, { passive: true });
  alDesplazar();

  /* ── Aparición suave al hacer scroll ──
     Solo se oculta lo que está por debajo de la pantalla al cargar, así la primera
     vista siempre está completa. Con "reducir movimiento" no se oculta nada. */
  var sinMovimiento = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (!sinMovimiento && "IntersectionObserver" in window) {
    var observador = new IntersectionObserver(function (entradas) {
      entradas.forEach(function (en) {
        if (en.isIntersecting) { en.target.classList.add("visible"); observador.unobserve(en.target); }
      });
    }, { rootMargin: "0px 0px -6% 0px", threshold: 0.06 });
    $$("[data-aparece]").forEach(function (el) {
      if (el.getBoundingClientRect().top > window.innerHeight * 0.94) {
        el.classList.add("pendiente");
        observador.observe(el);
      }
    });
  }
})();
</script>
