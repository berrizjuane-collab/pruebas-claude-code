name: Deploy NEON WRAITHS to GitHub Pages

on:
  push:
    branches:
      - main
      - juego/neon-wraiths
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      # Turns Pages on by itself when the repository allows it. On a private
      # repo the Actions token is not permitted to create the Pages site, so
      # this step is allowed to fail: the artifact still uploads and the deploy
      # job succeeds as soon as Pages is available.
      - uses: actions/configure-pages@v5
        continue-on-error: true
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
