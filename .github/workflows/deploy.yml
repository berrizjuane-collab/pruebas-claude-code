name: Deploy NEON WRAITHS to GitHub Pages

on:
  push:
    branches:
      - main
    # Only the projects that make up the published site; pushes that touch
    # other folders of the repository do not redeploy it.
    paths:
      - neon-wraiths/**
      - fable-5-1/**
      - .github/workflows/deploy.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: neon-wraiths
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: neon-wraiths/package-lock.json
      - run: npm ci
      - run: npm run build
      # The game is the site root; the Fable 5.1 page is served beside it.
      - run: cp ../fable-5-1/fable-5-1.html dist/
      # Tries to turn Pages on by itself. The default Actions token lacks the
      # administration permission needed to create the Pages site, so this step
      # is allowed to fail: the artifact still uploads and the deploy job
      # succeeds once Pages is enabled in Settings → Pages (Source: GitHub Actions).
      - uses: actions/configure-pages@v5
        continue-on-error: true
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: neon-wraiths/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
