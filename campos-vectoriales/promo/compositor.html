<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Campos · vídeo promocional</title>
    <style>
      /* Identidad del laboratorio: monocromo, Inter + JetBrains Mono + KaTeX para la notación. */
      @font-face {
        font-family: 'Inter';
        src: url('/m/@fontsource-variable/inter/files/inter-latin-wght-normal.woff2') format('woff2-variations');
        font-weight: 100 900;
      }
      @font-face {
        font-family: 'Inter';
        src: url('/m/@fontsource-variable/inter/files/inter-latin-ext-wght-normal.woff2') format('woff2-variations');
        font-weight: 100 900;
        unicode-range: U+0100-024F, U+1E00-1EFF;
      }
      @font-face {
        font-family: 'Inter';
        src: url('/m/@fontsource-variable/inter/files/inter-greek-wght-normal.woff2') format('woff2-variations');
        font-weight: 100 900;
        unicode-range: U+0370-03FF;
      }
      @font-face {
        font-family: 'JetBrains Mono';
        src: url('/m/@fontsource/jetbrains-mono/files/jetbrains-mono-latin-400-normal.woff2') format('woff2');
        font-weight: 400;
      }
      @font-face {
        font-family: 'JetBrains Mono';
        src: url('/m/@fontsource/jetbrains-mono/files/jetbrains-mono-latin-500-normal.woff2') format('woff2');
        font-weight: 500;
      }
      @font-face {
        font-family: 'KaTeX_Main';
        src: url('/m/katex/dist/fonts/KaTeX_Main-Regular.woff2') format('woff2');
      }
      @font-face {
        font-family: 'KaTeX_Main';
        src: url('/m/katex/dist/fonts/KaTeX_Main-Bold.woff2') format('woff2');
        font-weight: 700;
      }
      @font-face {
        font-family: 'KaTeX_Math';
        src: url('/m/katex/dist/fonts/KaTeX_Math-Italic.woff2') format('woff2');
        font-style: italic;
      }

      :root {
        --negro: #050505;
        --tinta: #f5f5f5;
        --gris-1: #c9c9c9;
        --gris-2: #8a8a8a;
        --gris-3: #4a4a4a;
        --display: 'Inter', system-ui, sans-serif;
        --mono: 'JetBrains Mono', ui-monospace, monospace;
        --mat: 'KaTeX_Main', 'Times New Roman', serif;
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        background: #000;
      }
      #escenario {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--negro);
        color: var(--tinta);
        font-family: var(--display);
      }
      canvas,
      .capa {
        position: absolute;
        inset: 0;
        width: 1920px;
        height: 1080px;
      }
      #grano {
        mix-blend-mode: screen;
        opacity: 0.035;
      }
      #vineta {
        background: radial-gradient(ellipse 75% 70% at 50% 50%, transparent 55%, rgba(0, 0, 0, 0.62) 100%);
      }
      /* Fundidos a negro de las transiciones (sin destellos blancos). */
      #negro {
        background: #050505;
        opacity: 0;
      }
      .t {
        position: absolute;
        white-space: nowrap;
        will-change: transform, opacity, filter;
        opacity: 0;
      }
      .mascara {
        display: inline-block;
        overflow: hidden;
        vertical-align: bottom;
        padding: 0.06em 0.02em 0.1em;
        margin: -0.06em -0.02em -0.1em;
      }
      .palabra {
        display: inline-block;
        will-change: transform;
      }
      .etiqueta {
        font-family: var(--mono);
        font-size: 20px;
        font-weight: 500;
        letter-spacing: 0.32em;
        text-transform: uppercase;
        color: var(--gris-1);
      }
      .mat {
        font-family: var(--mat);
      }
      .mat i {
        font-family: 'KaTeX_Math', serif;
        font-style: italic;
      }
      .mat b {
        font-weight: 700;
      }
      .punto {
        position: relative;
        display: inline-block;
      }
      .punto::before {
        content: '';
        position: absolute;
        left: 54%;
        top: 0.3em;
        width: 0.13em;
        height: 0.13em;
        border-radius: 50%;
        background: currentColor;
        transform: translateX(-50%);
      }
      .sombra {
        text-shadow: 0 0 40px rgba(0, 0, 0, 0.85), 0 2px 18px rgba(0, 0, 0, 0.9);
      }
      .brillo {
        text-shadow: 0 0 28px rgba(255, 255, 255, 0.35);
      }
      #banda {
        background: linear-gradient(90deg, rgba(5, 5, 5, 0.82) 0%, rgba(5, 5, 5, 0.55) 38%, transparent 70%);
        opacity: 0;
      }
    </style>
  </head>
  <body>
    <div id="escenario">
      <canvas id="toma" width="1920" height="1080"></canvas>
      <canvas id="fondo" width="1920" height="1080"></canvas>
      <div id="banda" class="capa"></div>
      <div id="textos" class="capa"></div>
      <div id="vineta" class="capa"></div>
      <div id="negro" class="capa"></div>
      <canvas id="grano" width="960" height="540"></canvas>
    </div>
    <script src="compositor.js"></script>
  </body>
</html>
